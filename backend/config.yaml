# Provider-agnostic LLM configuration.
# Everything vendor-specific lives here or in .env. Swap `base_url` alone to
# retarget OpenAI, Anthropic (compatible endpoint), Groq, OpenRouter, or a
# local vLLM / Ollama server. See .env.example for secrets/overrides.

llm:
  # LLM_PROVIDER in .env overrides this. Use "mock" for deterministic,
  # zero-cost, no-network operation. "gemini" / "openrouter" / "openai" all hit
  # an OpenAI-compatible endpoint via httpx (no vendor SDK).
  provider: nvidia          # mock | nvidia | gemini | openrouter | openai

  # OpenAI-compatible endpoint. OPENAI_BASE_URL in .env overrides this only for
  # the generic openai/openrouter providers (never nvidia/gemini).
  #   NVIDIA:     https://integrate.api.nvidia.com/v1
  #   Gemini:     https://generativelanguage.googleapis.com/v1beta/openai
  #   OpenRouter: https://openrouter.ai/api/v1
  base_url: https://integrate.api.nvidia.com/v1

  # NVIDIA build models. PROVISIONAL (ids/reasoning param pending the STEP 1
  # probe + 10-call reasoning validation — see docs/NVIDIA_SWITCH.md). Every
  # pipeline role runs the SAME main model at the SAME fixed minimal reasoning;
  # the two judge roles run openai/gpt-oss-20b at reasoning_effort "medium"
  # (replaces the earlier gpt-4o judge).
  models:
    chat:       deepseek-ai/deepseek-v4.1-flash   # answerer (all four systems)
    classifier: deepseek-ai/deepseek-v4.1-flash   # tier-1 gate / span (FRAME)
    extractor:  deepseek-ai/deepseek-v4.1-flash   # structuring FILL / self-consistency / P6
    simulator:  deepseek-ai/deepseek-v4.1-flash   # S9 (plays the USER)
    judge:      openai/gpt-oss-20b                # EVALUATION-ONLY default judge
    judge_longmemeval: openai/gpt-oss-20b         # EVALUATION-ONLY LongMemEval judge (official per-type prompts)
    embedding:  sentence-transformers/all-MiniLM-L6-v2   # local; vector_rag only (not an API call)
  # Fallback main models if DeepSeek fails the reasoning/latency gate, in order:
  #   qwen/qwen3-next-80b-a3b-instruct  ->  nvidia/nemotron-3-super-120b-a12b
  # Judge routing (evaluation only; never touches the pipeline).
  judge_routing:
    longmemeval: judge_longmemeval
    default: judge

  # Per-model vendor request params, merged into EVERY call to that model.
  # The main model's reasoning param is PROVISIONAL and must be confirmed to its
  # minimum by the STEP 1.3 10-call validation before a live run.
  request_params:
    "deepseek-ai/deepseek-v4.1-flash":
      reasoning_effort: "low"       # PROVISIONAL — validate minimal (none/0) in STEP 1.3
    "openai/gpt-oss-20b":
      reasoning_effort: "medium"    # judge: parse only the final answer, never the reasoning

  # Request defaults (per-call overrides allowed in code).
  timeout_seconds: 60
  temperature: 0.2
  max_tokens: 1024

pipeline:
  # Turns below this salience score are dropped before extraction.
  salience_threshold: 0.5
  # Confidence calibration: shrink raw model confidence toward this prior.
  # calibrated = prior + shrink * (raw - prior)
  calibration_prior: 0.5
  calibration_shrink: 0.8
  # A confirming re-observation nudges an existing node's confidence up by this.
  reinforce_step: 0.1
  # Two assertions resolve to the same node only above this lexical similarity
  # AND with a shared head noun / inflection — never across different keys.
  resolve_similarity: 0.92
  # A destructive operation (END / supersede) is applied only when operation
  # confidence is at least this. Below it, the op is blocked and queued for
  # confirmation rather than silently closing a correct node.
  destructive_min_conf: 0.80

storage:
  # Relative to the backend/ directory. Overridable via DB_PATH in .env.
  db_path: userstate.db

experiment:
  # NVIDIA build is a FREE TIER: no dollar cost, so the price-guard is skipped and
  # the run is bounded by a TOKEN budget instead (clean, resumable hard-stop).
  free_tier: true
  token_budget: 80000000       # 80M tokens total across the whole run
  rate_limit_per_min: 35       # shared across all workers + models + judge (NVIDIA ~40/min/key)
  # HARD SPEND CEILING for a PAID provider (ignored while free_tier: true).
  budget_usd: 25.00
  # Optional per-token prices (USD per 1,000,000 tokens) kept so an "equivalent
  # dollar cost" can be reported later; NOT used for the budget while free_tier.
  # Tokens are the cost metric for the cost-accuracy curve on this provider.
  prices_per_mtok:
    # Gemini (approx, USD per 1M tokens) — update to your billed rates.
    "gemini-2.5-flash": {input: 0.30, output: 2.50}
    "gemini-2.5-flash-lite": {input: 0.10, output: 0.40}
    "gemini-2.5-pro": {input: 1.25, output: 10.00}
    "gemini-2.0-flash": {input: 0.10, output: 0.40}
    "openai/gpt-4o-mini-2024-07-18": {input: 0.15, output: 0.60}
    "meta-llama/llama-3.1-8b-instruct": {input: 0.02, output: 0.03}
    "default": {input: 0.50, output: 1.50}

server:
  host: 127.0.0.1
  port: 8000
  # Frontend origins allowed by CORS.
  cors_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
